<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Хрум Дефенс</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700&family=Russo+One&display=swap" rel="stylesheet">
<style>
/* Layout idea: the hunting ground takes every pixel it can. A one-line HUD above it, one row of monsters and the wave button below.
   One visual world, dark by choice: charred earth, bone and blood. */
:root{
  --ink:#0d0908;
  --ink-2:#1e1412;
  --ink-3:#3b2520;
  --blood:#c2182b;
  --bone:#eadfc8;
  --ember:#ff8a3d;
  --display:'Russo One','Arial Black',system-ui,sans-serif;
  --body:'Rubik','Trebuchet MS',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--ink);color:var(--bone);font-family:var(--body);font-weight:500;
  display:flex;flex-direction:column;overflow:hidden;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;border:0;cursor:pointer}
button:focus-visible{outline:3px solid var(--ember);outline-offset:2px}

#hud{display:flex;align-items:center;gap:14px;padding:4px 16px;min-height:44px}
.stat{display:flex;align-items:baseline;gap:5px}
.stat small{font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.55}
.stat b{font-family:var(--display);font-weight:400;font-size:19px;font-variant-numeric:tabular-nums;display:inline-block;transform-origin:left center}
@keyframes bump{0%{transform:scale(1.22);color:#fff}100%{transform:scale(1)}}
#coins.bump{animation:bump .2s ease-out}
#lives{color:var(--blood)}
#wave{color:var(--ember)}
#hud .sp{flex:1}
.hb{background:var(--ink-2);box-shadow:inset 0 0 0 1px var(--ink-3);border-radius:9px;min-width:44px;height:36px;font-family:var(--display);font-size:14px}
#snd.off{opacity:.4;text-decoration:line-through}

#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
#cv{display:block;touch-action:none}
#toast{
  position:absolute;left:50%;top:10px;transform:translateX(-50%);max-width:92%;
  background:rgba(13,9,8,.92);color:var(--bone);padding:6px 12px;border-radius:8px;font-size:13px;text-align:center;
  opacity:0;transition:opacity .2s;pointer-events:none;box-shadow:0 0 0 2px var(--blood)
}
#toast.on{opacity:1}

#tray{padding:6px 16px 10px;display:grid;grid-template-columns:1fr 74px;gap:5px}
#towers{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.tw{
  background:linear-gradient(#2a1c19,#1a1210);border-radius:10px;padding:3px 0 5px;min-height:66px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid var(--ink-3)
}
.tw canvas{width:34px;height:34px}
.tw i{font-style:normal;font-family:var(--display);font-size:12px;color:var(--ember);line-height:1}
.tw.sel{border-color:var(--blood);background:linear-gradient(#4a1c1c,#2a1210)}
.tw.poor{opacity:.45}

#panel{display:grid;grid-template-columns:1.15fr 1fr 1fr 38px;gap:5px;align-items:stretch;min-height:66px}
#panel[hidden]{display:none}
#pinfo{display:flex;flex-direction:column;justify-content:center;line-height:1.2;min-width:0}
#pinfo b{font-family:var(--display);font-weight:400;font-size:12.5px}
#pinfo span{font-size:10.5px;opacity:.75}
#panel button{background:linear-gradient(#2a1c19,#1a1210);border:2px solid var(--ink-3);border-radius:10px;padding:4px 2px;font-size:11.5px;font-weight:700;line-height:1.25}
#panel button em{display:block;font-style:normal;font-family:var(--display);font-size:12px;color:var(--ember)}
#up:disabled{opacity:.45}
#close{font-size:18px}

#go{
  background:linear-gradient(#d51f33,#8f0f1e);color:#fff;border-radius:10px;min-height:66px;line-height:1.15;
  font-family:var(--display);font-size:13px;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 3px 0 #4a0810
}
#go b{display:block;font-weight:400;font-size:22px}
#go:disabled{background:var(--ink-2);color:var(--bone);opacity:.7;box-shadow:inset 0 0 0 1px var(--ink-3)}

#over{
  position:absolute;inset:0;background:rgba(13,9,8,.9);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px
}
#over[hidden]{display:none}
#over h1{font-family:var(--display);font-weight:400;font-size:28px;margin:0;color:var(--blood);text-wrap:balance}
#over p{margin:0;font-size:15px}
#again{background:var(--bone);color:var(--ink);border-radius:10px;height:50px;padding:0 28px;font-family:var(--display);margin-top:8px}
</style>
</head>
<body>
<div id="hud">
  <div class="stat"><small>Кости</small><b id="coins">0</b></div>
  <div class="stat"><small>Яйца</small><b id="lives">0</b></div>
  <div class="stat"><small>Волна</small><b id="wave">0</b></div>
  <div class="sp"></div>
  <button id="snd" class="hb" aria-label="Звук">♪</button>
  <button id="speed" class="hb" aria-label="Скорость игры">×1</button>
</div>

<div id="stage">
  <canvas id="cv"></canvas>
  <div id="toast"></div>
  <div id="over" hidden>
    <h1>Гнездо разорено</h1>
    <p id="overtxt"></p>
    <button id="again">Сыграть заново</button>
  </div>
</div>

<div id="tray">
  <div id="towers"></div>
  <div id="panel" hidden>
    <div id="pinfo"><b id="pname"></b><span id="pstat"></span></div>
    <button id="up"></button>
    <button id="sell"></button>
    <button id="close" aria-label="Закрыть">×</button>
  </div>
  <button id="go"></button>
</div>

<script>
(() => {
const $ = id => document.getElementById(id);
const cv = $('cv'), g = cv.getContext('2d');
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const angd = (a, b) => Math.atan2(Math.sin(a - b), Math.cos(a - b));
const TAU = 6.2832, BONE = '#eadfc8', DARK = '#0e0807';

/* ---------- board and path ---------- */
const COLS = 6, ROWS = 10;
const WP = [[1,-1.8],[1,1],[4,1],[4,4],[1,4],[1,7],[4,7],[4,8.75]];
const pts = WP.map(([c, r]) => ({ x: c + .5, y: r + .5 }));
const segs = []; let L = 0;
for (let i = 0; i < pts.length - 1; i++) {
  const a = pts[i], b = pts[i + 1], len = Math.hypot(b.x - a.x, b.y - a.y);
  segs.push({ a, b, len, s0: L, ang: Math.atan2(b.y - a.y, b.x - a.x) }); L += len;
}
function posAt(s) {
  if (s < 0) s = 0;
  for (const sg of segs) if (s <= sg.s0 + sg.len) {
    const k = (s - sg.s0) / sg.len;
    return { x: sg.a.x + (sg.b.x - sg.a.x) * k, y: sg.a.y + (sg.b.y - sg.a.y) * k, ang: sg.ang };
  }
  const l = pts[pts.length - 1]; return { x: l.x, y: l.y, ang: Math.PI / 2 };
}
const blocked = new Set();
for (const sg of segs) {
  const n = Math.ceil(sg.len);
  for (let i = 0; i <= n; i++) {
    const k = i / n;
    blocked.add(Math.floor(sg.a.x + (sg.b.x - sg.a.x) * k) + ',' + Math.floor(sg.a.y + (sg.b.y - sg.a.y) * k));
  }
}
blocked.add('4,9');
const NEST = { x: 4.5, y: 9.4 };

/* ---------- sound: everything is synthesised, nothing is loaded. Close, wet and panned to where it happens ---------- */
const A = { ctx: null, on: true, last: {}, pan: 0 };
function audioInit() {
  if (!A.on) return;
  try {
    if (!A.ctx) {
      const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
      A.ctx = new C(); A.master = A.ctx.createGain(); A.master.gain.value = .26;
      if (A.ctx.createDynamicsCompressor) { A.comp = A.ctx.createDynamicsCompressor(); A.master.connect(A.comp); A.comp.connect(A.ctx.destination); } else A.master.connect(A.ctx.destination);
      const n = Math.floor(A.ctx.sampleRate * .6); A.noise = A.ctx.createBuffer(1, n, A.ctx.sampleRate);
      const d = A.noise.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    }
    if (A.ctx.state === 'suspended') A.ctx.resume();
  } catch (e) { A.ctx = null; }
}
function can(name, gap) {
  if (!A.ctx || !A.on || A.ctx.state !== 'running') return false;
  const t = A.ctx.currentTime; if (t - (A.last[name] || -1) < gap) return false;
  A.last[name] = t; return true;
}
function out(node) { if (A.ctx.createStereoPanner) { const p = A.ctx.createStereoPanner(); p.pan.value = A.pan; node.connect(p); p.connect(A.master); } else node.connect(A.master); }
function nz(dur, type, f, q, vol, f2, delay) {
  const t = A.ctx.currentTime + (delay || 0), s = A.ctx.createBufferSource(); s.buffer = A.noise;
  const fl = A.ctx.createBiquadFilter(); fl.type = type; fl.frequency.setValueAtTime(f, t); if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + dur); fl.Q.value = q;
  const gn = A.ctx.createGain(); gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(.001, t + dur);
  s.connect(fl); fl.connect(gn); out(gn); s.start(t, Math.random() * .3); s.stop(t + dur + .02);
}
function tone(dur, type, f1, f2, vol, delay) {
  const t = A.ctx.currentTime + (delay || 0), o = A.ctx.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
  const gn = A.ctx.createGain(); gn.gain.setValueAtTime(.0001, t); gn.gain.linearRampToValueAtTime(vol, t + .008); gn.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(gn); out(gn); o.start(t); o.stop(t + dur + .02);
}
const glop = (v, d) => { tone(.11, 'sine', rnd(190, 270), 70, v, d); tone(.08, 'sine', rnd(320, 430), 120, v * .55, (d || 0) + .06); };
const SFX = {
  bite(big) {                                                        // teeth through skin: a few dry crunches, a thud, then the wet part
    if (!can('bite', .05)) return;
    for (let i = 0; i < (big ? 3 : 2); i++) nz(.035, 'bandpass', rnd(1200, 3000), 2, .42, 0, i * .018);
    tone(.09, 'sine', big ? 105 : 150, 50, big ? .5 : .28); nz(.13, 'lowpass', 900, .8, .26, 180, .03); glop(.14, .04);
  },
  squish() { if (!can('sq', .08)) return; nz(.2, 'lowpass', 900, .8, .32, 160); glop(.2, .02); },
  squelch() { if (!can('sqc', .07)) return; nz(.18, 'bandpass', rnd(500, 900), 6, .42, rnd(200, 350)); glop(.26); },
  smack() { if (!can('smack', .1)) return; nz(.05, 'bandpass', rnd(700, 1300), 3, .2); tone(.05, 'sine', rnd(240, 340), 150, .11); },
  drip() { if (!can('drip', .09)) return; tone(.07, 'sine', rnd(900, 1500), rnd(350, 500), .06); },
  thump() { if (!can('thump', .12)) return; tone(.1, 'sine', 70, 45, .32); },
  pop() { if (!can('pop', .1)) return; nz(.12, 'lowpass', 2600, .7, .5, 200); tone(.18, 'sine', 160, 40, .5); glop(.3, .05); },
  snap() { if (!can('snap', .07)) return; tone(.07, 'triangle', rnd(520, 820), 150, .16); nz(.02, 'highpass', 3000, .7, .14); },
  crack() { if (!can('crack', .09)) return; let d = 0; for (let i = 0; i < 5; i++) { nz(.03, 'highpass', rnd(1800, 3400), .7, .3, 0, d); d += rnd(.015, .05); } tone(.12, 'sine', 90, 40, .3); },
  clang() { if (!can('clang', .07)) return; tone(.08, 'square', 920, 700, .07); tone(.11, 'square', 1390, 1100, .05); },
  roar() { if (!can('roar', .5)) return; tone(.8, 'sawtooth', 92, 42, .3); nz(.8, 'lowpass', 320, 1, .3, 90); },
  grunt() { if (!can('grunt', .2)) return; tone(.2, 'sawtooth', 115, 68, .13); nz(.16, 'lowpass', 400, 1, .12); },
  squeak() { if (!can('squeak', .12)) return; tone(.07, 'sawtooth', rnd(1500, 2100), rnd(2400, 3000), .03); },
  croak() { if (!can('croak', .15)) return; tone(.06, 'square', 150, 95, .06); tone(.06, 'square', 140, 90, .06, .07); },
  slurp() { if (!can('slurp', .2)) return; for (let i = 0; i < 6; i++) nz(.1, 'bandpass', 350 + i * 220, 7, .2, 600 + i * 260, i * .06); glop(.16, .36); },
  place() { if (!can('place', .05)) return; tone(.13, 'sine', 120, 45, .5); nz(.09, 'lowpass', 500, 1, .22); },
  tick() { if (!can('tick', .03)) return; tone(.03, 'square', 660, 640, .05); },
  horn() { if (!can('horn', .3)) return; tone(.55, 'sawtooth', 98, 92, .14); tone(.55, 'sawtooth', 147, 139, .09); },
  lost() { if (!can('lost', .1)) return; tone(.38, 'triangle', 330, 105, .25); },
  spit() { if (!can('spit', .08)) return; nz(.12, 'bandpass', 900, 2, .3, 2400); tone(.08, 'sine', 400, 150, .2); },
  sizzle() { if (!can('sizzle', .12)) return; nz(.3, 'highpass', 3500, .5, .1); nz(.22, 'bandpass', 6000, 3, .07); },
  coin() { if (!can('coin', .045)) return; tone(.05, 'square', 1250, 1600, .04); },
  combo(n) { if (!can('combo', .05)) return; const f = 330 * Math.pow(1.122, Math.min(n - 1, 14)); tone(.14, 'triangle', f, f * 1.5, .16); },
  lick() { if (!can('lick', .06)) return; nz(.1, 'bandpass', 1500, 3, .22, 480); glop(.12, .05); }
};
const sfx = (n, a, x) => { try { A.pan = x === undefined ? 0 : clamp((x / COLS * 2 - 1) * .8, -1, 1); SFX[n](a); } catch (e) {} };

/* ---------- monsters (towers) ---------- */
const T = {
  chomp: { name: 'Грызень', cost: 50, range: 1.5, rate: .5, dmg: 1, hr: .27, mouth: 1.15, neck: ['#8a6a34', '#4a3418'], desc: 'Грызень: рвёт мясо быстро, но только вблизи' },
  neck:  { name: 'Змееглав', cost: 90, range: 2.7, rate: 1.15, dmg: 3, hr: .2, mouth: 1.3, neck: ['#7d5cc4', '#3d2a6b'], desc: 'Змееглав: бьёт издалека и вырывает кусок втрое больше' },
  lick:  { name: 'Языкан', cost: 70, range: 1.9, rate: .85, dmg: 1, slow: .5, hr: .3, mouth: .72, desc: 'Языкан: цепляет языком и держит, тварь еле ползёт' },
  acid:  { name: 'Кислотник', cost: 110, range: 2.6, rate: 2.2, dmg: 1, hr: .3, mouth: 1.25, desc: 'Кислотник: плюёт лужу кислоты, она разъедает всех, кто в ней, и растворяет панцирь' },
  grab:  { name: 'Душитель', cost: 120, range: 2.0, rate: 2.6, dmg: 2, hr: .34, mouth: 0, desc: 'Душитель: обвивает щупальцем, давит и швыряет назад по тропе' },
  glut:  { name: 'Пасть', cost: 140, range: 1.45, rate: 1.35, dmg: 2, aoe: true, hr: .44, mouth: 0, desc: 'Пасть: мясной цветок в яме, рвёт всех вокруг разом' }
};
const MAXLVL = 4, MUT = { chomp: 'Бешеный', neck: 'Потрошитель', lick: 'Хват', glut: 'Воронка', acid: 'Желчь', grab: 'Кракен' };   // level 4 is a mutation with its own trick
const tStat = t => {
  const d = T[t.type], l = Math.min(t.lvl, 3) - 1, mut = t.lvl >= 4;
  return { mut, dmg: Math.round(d.dmg * (l + 1) * (mut && t.type === 'neck' ? 1.6 : 1)), rate: d.rate * Math.pow(.85, l) * (mut && t.type === 'chomp' ? .55 : 1), range: d.range + .22 * l + (mut && t.type === 'glut' ? .45 : 0), slow: d.slow ? d.slow - .1 * l : 0 };
};
const upCost = t => t.lvl >= 3 ? T[t.type].cost * 2 : Math.round(T[t.type].cost * .7 * t.lvl);

/* ---------- creatures. segs: [x, rx, ry] in body radii, tail first, head last; legs: [segment, x] ---------- */
const K = {
  bug:   { r: .28, hp: 4,   sp: .95, rew: 3,  soft: .7,  leg: .5,  segs: [[-.38, .6, .52], [.18, .4, .4], [.6, .3, .3]], legs: [[1, -.28], [1, 0], [1, .28]] },
  toad:  { r: .35, hp: 11,  sp: .65, rew: 6,  soft: 1,   leg: .55, segs: [[-.2, .78, .72], [.55, .48, .52]], legs: [[0, -.45], [0, .35]], cols: ['#8fae4a', '#6b8f3a', '#34491c'] },
  shell: { r: .37, hp: 20,  sp: .55, rew: 9,  soft: .4,  leg: .35, segs: [[-.15, .82, .68], [.68, .34, .34]], legs: [[0, -.5], [0, 0], [0, .5]], cols: ['#b08f78', '#8a6f5a', '#45332a'], armor: true },
  boar:  { r: .45, hp: 50,  sp: .36, rew: 22, soft: .45, leg: .45, segs: [[-.5, .55, .52], [.05, .68, .6], [.68, .4, .38]], legs: [[0, -.1], [1, .25]], cols: ['#8a6450', '#6b4a3a', '#2f1f17'] },
  worm:  { r: .2,  hp: 14,  sp: .5,  rew: 8,  soft: 1,   leg: 0,   segs: [[-2.5, .52, .52], [-1.65, .6, .6], [-.8, .66, .66], [.05, .66, .66], [.8, .5, .5]], legs: [], cols: ['#eab0b6', '#b56a78', '#5a2a38'] },
  brood: { r: .6,  hp: 150, sp: .27, rew: 60, soft: .9,  leg: .4,  segs: [[-.42, .72, .78], [.22, .55, .55], [.72, .33, .33]], legs: [[0, .3], [1, -.25], [1, .1], [1, .4]], cols: ['#b07a9a', '#8d5a7a', '#40243a'], split: 8 }
};
const BUGS = [['#9cbb4e', '#7c9a3a', '#3c4f19'], ['#c98345', '#a8642a', '#522e11'], ['#8a7be0', '#6a5acd', '#2f2670'], ['#49ad9f', '#2f8f83', '#143d38'], ['#d4b545', '#b89b2e', '#5c4c10']];

/* ---------- state ---------- */
let S, best = 0;
try { best = +localStorage.getItem('hrum-best') || 0; } catch (e) {}

function fresh() {
  return { coins: 130, lives: 15, wave: 0, active: false, queue: [], spawnT: 0, gap: .9, time: 0, shake: 0, fadeT: 0, freeze: 0, slowT: 0,
           cam: { x: COLS / 2, y: ROWS / 2, z: 1 }, camT: { x: COLS / 2, y: ROWS / 2, z: 1 },
           enemies: [], carc: [], towers: [], parts: [], texts: [], strands: [], pools: [], flashes: [], guts: [], spurts: [], fly: [], lens: [], links: [], shots: [], acid: [], pending: 0, combo: 0, comboT: 0, banner: null, waveTotal: 0,
           build: null, sel: null, speed: 1, over: false };
}
function mkTower(type, c, r, lvl, spent) {
  return { type, c, r, x: c + .5, y: r + .5, lvl, spent, cd: 0, ang: Math.PI / 2,
           phase: 'idle', pt: 0, hx: c + .5, hy: r + .5, bx: 0, by: 0, wx: 0, wy: 0, kx: 0, ky: 0, tseg: null,
           chew: 0, chunk: null, tg: null, carry: null, ldur: .1, bdur: .2, flash: 0, gore: 0, eaten: 0, blink: rnd(1, 4), ph: rnd(0, 6), gone: false };
}

/* ---------- waves ---------- */
function buildWave(w) {
  const q = [], add = (k, n) => { for (let i = 0; i < n; i++) q.push(k); };
  add('bug', Math.min(5 + w * 2, 30));
  if (w >= 2) add('toad', Math.min(1 + w, 20));
  if (w >= 3) add('worm', Math.min(w - 1, 9));
  if (w >= 4) add('shell', Math.min(w - 2, 14));
  if (w >= 6) add('boar', Math.min(Math.floor(w / 3), 9));
  for (let i = q.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [q[i], q[j]] = [q[j], q[i]]; }
  if (w % 5 === 0) add('brood', w / 5);
  return q;
}
const hpMul = w => 1 + .14 * (w - 1) + .012 * (w - 1) * (w - 1);

function startWave() {
  if (S.active || S.over) return;
  S.wave++; S.queue = buildWave(S.wave); S.active = true; S.spawnT = 0;
  S.gap = Math.max(.45, 1 - .03 * S.wave); S.waveTotal = S.queue.length;
  sfx('horn'); ui();
}
function spawn(kind, s) {
  const d = K[kind], R = d.r, max = Math.max(1, Math.round(d.hp * hpMul(Math.max(1, S.wave)))), n = d.segs.length, hx = d.segs[n - 1][0];

function update(dt) {

  }
  for (const e of S.enemies) if (e.hp > 0) updateEnemy(e, dt);

/* Пасть: a flesh flower in a pit. fold 0 = petals flat and open, 1 = snapped shut into a bud */

    const b = S.banner, age = b.max - b.life, pop = age < .18 ? .6 + .5 * Math.sin(age / .18 * Math.PI / 2) + .25 * Math.sin(age / .18 * Math.PI) : 1.1 - .1 * Math.min(1, (age - .18) / .2);
    let fs = W * .1 * pop; g.font = fs + 'px "Russo One", sans-serif';
    const tw = g.measureText(b.txt).width; if (tw > W * .92) { fs *= W * .92 / tw; g.font = fs + 'px "Russo One", sans-serif'; }
    g.globalAlpha = clamp(b.life * 3, 0, 1);
    g.lineWidth = fs * .22; g.strokeStyle = '#1a0408'; g.strokeText(b.txt, W / 2, H * .4); g.fillStyle = '#ffffff'; g.fillText(b.txt, W / 2, H * .4);
    if (b.sub) { g.font = W * .05 + 'px "Russo One", sans-serif'; g.lineWidth = W * .012; g.strokeText(b.sub, W / 2, H * .4 + W * .075); g.fillStyle = '#ff8a3d'; g.fillText(b.sub, W / 2, H * .4 + W * .075); }
    g.globalAlpha = 1;
  }
}

/* ---------- input and UI ---------- */
const towerAt = (c, r) => S.towers.find(t => t.c === c && t.r === r);
let toastT = 0;
function toast(msg) { const el = $('toast'); el.textContent = msg; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 2000); }

document.addEventListener('pointerdown', audioInit, true);
document.addEventListener('click', audioInit, true);

cv.addEventListener('pointerdown', ev => {
  if (S.over) return;
  const rc = cv.getBoundingClientRect();
  const wx = ((ev.clientX - rc.left) / rc.width * cv.width - view.tx) / view.a, wy = ((ev.clientY - rc.top) / rc.height * cv.height - view.ty) / view.a;
  const c = Math.floor(wx), r = Math.floor(wy);
  if (c < 0 || r < 0 || c >= COLS || r >= ROWS) return;
  const t = towerAt(c, r);
  if (t) { S.sel = S.sel === t ? null : t; S.build = null; sfx('tick'); ui(); return; }
  if (S.sel) { S.sel = null; ui(); return; }
  if (!S.build) { toast('Сначала выбери чудовище внизу'); return; }
  if (blocked.has(c + ',' + r)) { toast('На тропе и в гнезде логово не вырыть'); return; }
  const d = T[S.build];
  if (S.coins < d.cost) { toast('Не хватает костей: нужно ' + d.cost); return; }
  S.coins -= d.cost;
  S.towers.push(mkTower(S.build, c, r, 1, d.cost));
  puff(c + .5, r + .5, 'rgba(120,95,70,.4)', 8, 1.6, .22); ring(c + .5, r + .5, BONE, 1, .25); S.shake = Math.max(S.shake, .04); sfx('place');
  ui();
});

const btns = {};
for (const key of Object.keys(T)) {
  const d = T[key], b = document.createElement('button');
  b.className = 'tw'; b.id = 'tw-' + key; b.setAttribute('aria-label', d.name + ', ' + d.cost + ' костей');
  const ic = document.createElement('canvas'), q = Math.min(3, window.devicePixelRatio || 1);
  ic.width = ic.height = 38 * q;
  const c = ic.getContext('2d'); c.scale(38 * q, 38 * q);
  if (key === 'glut') drawFlower(c, .5, .5, .43, .08, .3, 0, 0);
  else if (key === 'grab') drawGrab(c, .5, .5, .3, .5, 1, 0, false);
  else { const [oy, r] = { chomp: [.64, .29], neck: [.67, .35], lick: [.52, .36], acid: [.6, .3] }[key]; drawMonster(c, key, .5, oy, r, -Math.PI / 2, .4, 1, 1, 0, false, 0); }
  b.append(ic);
  const p = document.createElement('i'); p.textContent = d.cost; b.append(p);
  b.addEventListener('click', () => { S.build = S.build === key ? null : key; S.sel = null; sfx('tick'); if (S.build) toast(d.desc); ui(); });
  $('towers').append(b); btns[key] = b;
}
$('up').addEventListener('click', () => {
  const t = S.sel; if (!t || t.lvl >= MAXLVL) return;
  const cost = upCost(t);
  if (S.coins < cost) { toast('Не хватает костей: нужно ' + cost); return; }
  S.coins -= cost; t.spent += cost; t.lvl++; if (t.lvl >= 4) { banner(MUT[t.type].toUpperCase(), 'мутация: ' + T[t.type].name, 1.4); lens(1); S.shake = Math.max(S.shake, .1); sfx('roar'); } puff(t.x, t.y, 'rgba(234,223,200,.35)', 8, 1.6, .2); ring(t.x, t.y, '#ff8a3d', 1.2, .3); flash(t.x, t.y, 2, .3); sfx('place'); ui();
});
$('sell').addEventListener('click', () => {
  const t = S.sel; if (!t) return;
  t.gone = true;
  S.coins += Math.round(t.spent * .6); S.towers = S.towers.filter(x => x !== t); S.sel = null; sfx('tick'); ui();
});
$('close').addEventListener('click', () => { S.sel = null; ui(); });
$('go').addEventListener('click', startWave);
$('speed').addEventListener('click', () => { S.speed = S.speed % 3 + 1; sfx('tick'); ui(); });
$('snd').addEventListener('click', () => { A.on = !A.on; $('snd').classList.toggle('off', !A.on); if (A.on) { audioInit(); sfx('tick'); } });
$('again').addEventListener('click', () => { S = fresh(); $('over').hidden = true; resize(); ui(); });

function ui() {
  $('coins').textContent = S.coins - S.pending; $('lives').textContent = S.lives; $('wave').textContent = S.wave;
  $('speed').textContent = '×' + S.speed;
  for (const k in btns) { btns[k].classList.toggle('sel', S.build === k); btns[k].classList.toggle('poor', S.coins < T[k].cost); }
  const t = S.sel;
  $('towers').style.display = t ? 'none' : '';
  $('panel').hidden = !t;
  if (t) {
    const st = tStat(t);
    $('pname').textContent = t.lvl >= 4 ? T[t.type].name + ' · ' + MUT[t.type] : T[t.type].name + ' ' + t.lvl;
    $('pstat').textContent = 'кусок ' + st.dmg + ' · ' + (1 / st.rate).toFixed(1) + '/с';
    const up = $('up');
    if (t.lvl >= MAXLVL) { up.textContent = 'Максимум'; up.disabled = true; }
    else { up.innerHTML = (t.lvl >= 3 ? 'Мутация' : 'Откормить') + '<em>' + upCost(t) + '</em>'; up.disabled = S.coins < upCost(t); }
    $('sell').innerHTML = 'Прогнать<em>+' + Math.round(t.spent * .6) + '</em>';
  }
  const go = $('go');
  go.disabled = S.active;
  go.innerHTML = S.active ? 'Ползут<b>' + S.wave + '</b>' : 'Волна<b>' + (S.wave + 1) + '</b>';
}

/* ---------- boot ---------- */
function start(saved) {
  S = fresh();
  if (saved && saved.towers) {
    S.coins = saved.coins; S.lives = saved.lives; S.wave = saved.wave;
    S.towers = saved.towers.filter(t => T[t.type] && t.c < COLS && t.r < ROWS && !blocked.has(t.c + ',' + t.r)).map(t => mkTower(t.type, t.c, t.r, t.lvl, t.spent));
  }
  resize(); ui();
  let last = performance.now(), acc = 0; const STEP = .01;
  (function frame(now) {
    const real = Math.min(.05, (now - last) / 1000); last = now;
    S.shake *= Math.exp(-real * 9); if (S.shake < .002) S.shake = 0;
    let dt = real;
    if (S.freeze > 0) { S.freeze -= real; dt = 0; }                  // a held frame on a heavy bite
    else if (S.slowT > 0) { S.slowT -= real; dt = real * .25; if (S.slowT <= 0) S.camT = { x: COLS / 2, y: ROWS / 2, z: 1 }; }   // slow motion on a boss kill
    const ck = Math.min(1, real * 6); S.cam.x += (S.camT.x - S.cam.x) * ck; S.cam.y += (S.camT.y - S.cam.y) * ck; S.cam.z += (S.camT.z - S.cam.z) * ck;
    if (!S.over && dt > 0) {                                         // physics runs in fixed 1/100 s steps, however the frames fall
      acc += dt * S.speed; let n = 0;
      while (acc >= STEP && n < 18) { update(STEP); acc -= STEP; n++; }
      if (n === 18) acc = 0;
    }
    requestAnimationFrame(frame);
    draw();
  })(last);
}
let rzT = 0;
window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(resize, 120); });
window.claude?.hot?.snapshot?.(() => ({
  coins: S.coins, lives: S.lives, wave: S.active ? S.wave - 1 : S.wave,
  towers: S.towers.map(t => ({ type: t.type, c: t.c, r: t.r, lvl: t.lvl, spent: t.spent }))
}));
if (window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>
