cake(g,150,Y+64);g.textAlign='center';g.font='900 29px '+F;g.fillStyle='#f4c2cf';g.fillText('Торт съеден!',150,Y+141);g.fillStyle='#c8264f';g.fillText('Торт съеден!',150,Y+138);g.font='700 13px '+F;g.fillStyle='#8a6a58';g.fillText('Первая смена за 4:12',150,Y+162);

const recEl=document.getElementById('rec'),cards={},cardImg=r=>cards[r]||(cards[r]=buildCard(r));
const sp=[],tw=[];let t=0,age=0,flash=-1;document.getElementById('re').onclick=()=>{age=0;flash=-1;sp.length=0;tw.length=0};
function trophy(dt){const rec=recEl.checked,pal=rec?['#ffb020','#ffe58a','#ffc640','#8a5208']:['#ff5d8f','#ffd23f','#ff7a9c','#8f1838'];age+=dt;t+=dt;

/* ---------- shared streak driver ---------- */
function driver(onBite,onEnd){const D={combo:0,T:0,last:0,sum:0,phase:'bite',wait:0.6,target:5,end:0,close:false};
D.step=dt=>{const was=D.T>0;D.T=Math.max(0,D.T-dt);if(D.phase==='bite'){D.wait-=dt;if(D.wait<=0){const close=D.T>0&&D.T<0.45;if(D.T>0)D.combo++;else{D.combo=1;D.sum=0}D.T=2.6;D.last=D.combo;const add=2*Math.min(D.combo,5);D.sum+=add;onBite(D,add,close);if(D.combo>=D.target)D.phase='drain';else D.wait=Math.random()<0.25?rnd(2.1,2.35):rnd(0.45,0.8)}}

/* ---------- A: jar ---------- */
