<style>

<script>
(()=>{const root=document.getElementById('kr'),RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const T=id=>document.getElementById(id).innerHTML;
const VAR=[
{k:'v1',name:'1. Кремовые пилюли',txt:'Родной язык игры: кремовые плашки с тёмным текстом и плотной тенью, как у сообщений и кнопок. Шкала события и таймер магнита заполняют саму плашку, отдельных полосок нет. Сахар влетает в лимонное гнездо с кубиком.'},
{k:'v2',name:'2. Чистая типографика',txt:'Без подложек: только крупные цифры с тенью игры и цветом по смыслу, сахар лимонный, серия ягодная. Меньше всего закрывает поле. Радость здесь в движении: барабан цифр, вспышка на кончике шкалы.'},
{k:'v3',name:'3. Глянцевые леденцы',txt:'Каждый показатель как твёрдая карамель: глянец сверху, тень снизу, цвет по смыслу. Шкала стала стеклянной трубочкой с карамельной начинкой, в конце которой лимонный леденец с челюстями.'}];
const S={mass:144,sug:67,combo:0,cT:0,prog:.55,mag:10,nb:.8,ev:0,ms:0};const views=[];
function odo(el){const st={el,len:0};st.set=v=>{const s=String(v);if(s.length!==st.len){el.innerHTML=s.split('').map(()=>'<span class="c"><span class="s">'+'0123456789'.split('').map(d=>'<span>'+d+'</span>').join('')+'</span></span>').join('');st.len=s.length;[...el.querySelectorAll('.s')].forEach((x,i)=>{x.style.transition='none';x.style.transform=`translateY(${-(+s[i])*1.16}em)`;x.offsetHeight;x.style.transition=''})}else[...el.querySelectorAll('.s')].forEach((x,i)=>x.style.transform=`translateY(${-(+s[i])*1.16}em)`)};return st}
function hudHTML(k){const cube=T('cubeT'),mag=T('magT'),jaw=T('jawT');
if(k==='v1')return`<div class="mass"><span class="odo m"></span><span class="lbl">масса</span></div><div class="sug"><span class="sock">${cube}</span><span class="odo s1"></span><span class="mult">×2</span></div><div class="prog"><span class="fill"></span><span class="t">до пираний</span><b class="left">22</b>${jaw}</div><div class="buffs"><span class="buff"><span class="bf"></span>${mag}</span><span class="bnum">5 с</span></div>`;
if(k==='v2')return`<div class="mass"><span class="odo m"></span><span class="lbl">масса</span></div><div class="sug"><span class="sock">${cube}</span><span class="odo s1"></span><span class="mult">×2</span></div><div class="prog"><div class="lr">${jaw}до пираний<b class="left">22</b></div><div class="tr"><span class="fill"></span></div></div><div class="buffs"><span class="buff">${mag}<span class="mask">${mag}</span></span><span class="bnum">5 с</span></div>`;
return`<div class="mass"><span class="odo m"></span><span class="lbl">масса</span></div><div class="sug"><span class="sock">${cube}</span><span class="odo s1"></span><span class="mult">×2</span></div><div class="prog"><div class="lr">до пираний<b class="left">22</b></div><div class="tw"><div class="tube"><span class="fill"></span></div><span class="cap2">${jaw}</span></div></div><div class="buffs"><span class="buff"><span class="bf"></span>${mag}<span class="bnum">5 с</span></span></div>`}
const field=`<div class="pc" style="left:150px;top:176px;width:96px;height:96px;background:#ff4f7b"><i class="e" style="left:52%"></i><i class="e" style="left:74%"></i></div><div class="pc bot" style="left:262px;top:168px;width:60px;height:60px;background:#7ed957"><i class="e" style="left:18%"></i><i class="e" style="left:42%"></i></div>`;
const board=`<div class="board">${[['1','#4fe3c1','Желешка','456'],['2','#ff6fb5','Жвачка','321'],['3','#7ed957','Мармелад','263'],['8','#ff4f7b','Кусака','144']].map((r,i)=>`<div class="${i===3?'me':''}"><s>${r[0]}</s><u style="background:${r[1]}"></u><em>${r[2]}</em><b class="${i===3?'bm':''}">${r[3]}</b></div>`).join('')}</div>`;
const btns=`<div class="btns"><i><svg viewBox="0 0 24 24" fill="#3a2118"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg></i><i><svg viewBox="0 0 24 24" fill="#3a2118"><path d="M4 9h4l6-5v16l-6-5H4z"/></svg></i></div>`;
for(const v of VAR){const row=document.createElement('div');row.className='row';row.innerHTML=`<div class="scr">${field}${btns}${board}<div class="hud ${v.k}">${hudHTML(v.k)}</div><div class="evt">Пираньи идут!</div></div><div class="cap"><h3>${v.name}</h3><p>${v.txt}</p></div>`;root.appendChild(row);
const scr=row.querySelector('.scr'),h=row.querySelector('.hud');const V={scr,h,m:odo(h.querySelector('.odo.m')),s:odo(h.querySelector('.odo.s1')),sock:h.querySelector('.sock'),mult:h.querySelector('.mult'),prog:h.querySelector('.prog'),left:h.querySelector('.left'),jaw:h.querySelector('.jaw'),buff:h.querySelector('.buff'),bnum:h.querySelector('.bnum'),evt:row.querySelector('.evt'),bm:row.querySelector('.bm'),pc:row.querySelector('.pc'),bot:row.querySelector('.bot'),shown:S.sug};V.m.set(S.mass);V.s.set(S.sug);views.push(V)}
function render(){for(const V of views){V.prog.style.setProperty('--p',S.prog.toFixed(3));V.left.textContent=Math.max(0,Math.round((1-S.prog)*60));V.jaw.querySelector('.jt').style.transform=`translateY(${-(1-S.prog)*3.2}px)`;V.jaw.querySelector('.jb').style.transform=`translateY(${(1-S.prog)*3.2}px)`;V.jaw.classList.toggle('hungry',S.prog>.85&&S.ev<=0);
V.buff.style.setProperty('--t',(S.mag/10).toFixed(3));V.bnum.textContent=Math.ceil(S.mag)+' с'}}
function restart(el,c){el.classList.remove(c);void el.offsetWidth;el.classList.add(c)}
function bite(){S.combo=S.cT>0?S.combo+1:1;S.cT=2.6;S.mass+=3;S.prog=Math.min(1,S.prog+.05);const add=2*Math.min(S.combo,5),n=Math.min(S.combo,5)+1;
